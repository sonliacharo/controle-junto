spring.application.name=controlejunto
server.port=8080

# ------------------------------------------------------------------
# Banco de dados
# Com as variáveis DB_URL, DB_USER e DB_PASSWORD definidas, o sistema
# usa o Supabase (PostgreSQL na nuvem). Sem elas, sobe com H2 em memória.
# Exemplo de DB_URL do Supabase:
#   jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:controlejunto;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

# Cria/atualiza as tabelas a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Console do H2 (só funciona no modo H2): http://localhost:8080/h2-console
spring.h2.console.enabled=true

# ------------------------------------------------------------------
# Segurança (RNF-003 e RNF-005)
# ------------------------------------------------------------------
app.jwt.segredo=${JWT_SECRET:controlejunto-segredo-de-desenvolvimento-troque-em-producao-123456}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:30}

# ------------------------------------------------------------------
# Inteligência Artificial (RF-010, RNF-015)
# Com GEMINI_API_KEY definida, usa a API do Google Gemini.
# Sem chave, ou se a API falhar/demorar mais que o timeout, usa as regras locais.
# ------------------------------------------------------------------
app.ia.chave=${GEMINI_API_KEY:}
app.ia.modelo=${GEMINI_MODELO:gemini-2.5-flash}
app.ia.timeout-segundos=3

# Cria usuários e dados de exemplo na primeira execução (útil para a apresentação)
app.dados-exemplo=${DADOS_EXEMPLO:true}
