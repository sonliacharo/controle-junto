spring.application.name=controlejunto
server.port=8080

# Lê o .env da raiz do projeto, se existir
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Banco de dados: Supabase se DB_URL estiver definida, senão H2 em memória
spring.datasource.url=${DB_URL:jdbc:h2:mem:controlejunto;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Console do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Login (JWT). A sessão expira após 30 minutos sem uso
app.jwt.segredo=${JWT_SECRET:controlejunto-segredo-de-desenvolvimento-troque-em-producao-123456}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:30}

# IA (Gemini). Sem chave ou se a API não responder a tempo, usa palavras-chave
app.ia.chave=${GEMINI_API_KEY:}
app.ia.modelo=${GEMINI_MODELO:gemini-3.5-flash-lite}
app.ia.timeout-segundos=${IA_TIMEOUT_SEGUNDOS:5}

# Cria usuários e dados de exemplo na primeira execução
app.dados-exemplo=${DADOS_EXEMPLO:true}